# 发布流水线 (0.1.0 起): tag 触发 → 四平台交叉编译 → GitHub Release
#
# 触发: git tag v0.1.0 && git push origin v0.1.0
#
# 单 job 构建全部平台：bun --compile 的 --target 本身就能在 linux-x64 上交叉
# 编译四个平台，四平台 matrix 会把 --all 重复跑四遍，并放大 setup-bun 下载
# 资源的瞬时 504 风险。

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # GitHub Release 上传

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # 固定版本而不是 latest：latest 解析到的 1.4.4 资源曾在 GitHub
          # Releases CDN 稳定 504；1.4.3 可直接复现构建。
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # tag 是版本单一真相源: 构建前把 runner 内 checkout 的 package.json
      # 同步到 tag 版本（不提交），因此发版无需手动改 package.json。
      - name: Sync package version from tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.version=process.argv[1]; fs.writeFileSync("package.json", JSON.stringify(p,null,2)+"\n")' "$TAG_VERSION"
          node -p '"package.json version -> " + require("./package.json").version'

      # 四平台交叉编译全在 ubuntu 完成; 版本经 --define 注入二进制
      # (bot --version / gateway identify 可见)。
      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}" bun run scripts/build-release.ts --all

      - name: Stage binaries
        run: |
          mkdir -p dist
          # dist/release/<platform>/bot → dist/bot-<platform>.tar.gz
          for dir in dist/release/*/; do
            platform=$(basename "$dir")
            chmod +x "$dir/bot"
            tar -czf "dist/bot-${platform}.tar.gz" -C "$dir" bot
          done
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
